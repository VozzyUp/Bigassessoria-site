# Stack para o Portainer (Repository: https://github.com/VozzyUp/Bigassessoria-site, branch main).
# Preencha as variáveis na própria stack do Portainer (Environment variables). Nenhuma fica no Git.
services:
  site:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    image: bigassessoria-site:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL:-}
      UAZAPI_WEBHOOK_SECRET: ${UAZAPI_WEBHOOK_SECRET}
      WHATSAPP_PUBLICO: ${WHATSAPP_PUBLICO:-}
      HASH_SALT: ${HASH_SALT}
    expose:
      - "3000"
    # Ajustar ao proxy que você já usa nos outros projetos (Traefik, Nginx Proxy Manager...).
    # Exemplo para Traefik, depois de trocar o domínio e o nome da rede/entrypoint:
    # networks: [proxy]
