# Stack da Big Assessoria para o Portainer em Docker Swarm com Traefik.
# O banco, o login e os arquivos ficam no Supabase gerenciado; aqui roda só o app (e as tarefas em segundo plano).
# A imagem é construída pelo GitHub (.github/workflows/docker.yml). Variáveis: deploy/stack.env.example.
# Passo a passo: replica/deploy-vps.md.
version: "3.8"

services:
  app:
    image: ${IMAGE:-ghcr.io/vozzyup/bigassessoria-site:latest}
    environment:
      NODE_ENV: production
      # Supabase (Project Settings > API)
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      # Segredos do app
      DOCUMENTOS_SECRET: ${DOCUMENTOS_SECRET}
      HASH_SALT: ${HASH_SALT}
      UAZAPI_WEBHOOK_SECRET: ${UAZAPI_WEBHOOK_SECRET}
      # WhatsApp (UAZAPI)
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL}
      WHATSAPP_PUBLICO: ${WHATSAPP_PUBLICO}
      # Agente de IA
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Anúncios (preencher quando tiver)
      META_PIXEL_ID: ${META_PIXEL_ID}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID}
      META_ADS_TOKEN: ${META_ADS_TOKEN}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN}
      GOOGLE_ADS_ACAO_QUALIFICADO: ${GOOGLE_ADS_ACAO_QUALIFICADO}
      GOOGLE_ADS_ACAO_DOCUMENTACAO: ${GOOGLE_ADS_ACAO_DOCUMENTACAO}
      GOOGLE_ADS_ACAO_PROPOSTA: ${GOOGLE_ADS_ACAO_PROPOSTA}
      GOOGLE_ADS_ACAO_CONTRATO: ${GOOGLE_ADS_ACAO_CONTRATO}
      # Tarefas em segundo plano dentro do container (conversões, alertas, gastos). Uma réplica só.
      JOBS_ATIVOS: "true"
    networks: [publica]
    deploy:
      replicas: 1
      restart_policy: { condition: any }
      update_config: { order: start-first, failure_action: rollback }
      resources: { limits: { memory: 1024M } }
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK}
        - traefik.http.routers.bigassessoria.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.bigassessoria.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.bigassessoria.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencryptresolver}
        - traefik.http.services.bigassessoria.loadbalancer.server.port=3000

networks:
  publica:
    external: true
    name: ${TRAEFIK_NETWORK}
